app = "altmanai-ci-server"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 15

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  LOG_LEVEL = "info"
  SERVICE_NAME = "altmanai-ci-server"
  SERVICE_VERSION = "0.2.0"
  MAX_BODY_BYTES = "1048576"
  GITHUB_REQUEST_TIMEOUT_MS = "10000"
  WEBHOOK_RATE_LIMIT_WINDOW_MS = "60000"
  WEBHOOK_RATE_LIMIT_MAX = "120"
  TRUST_PROXY_HEADERS = "true"
  ALLOWED_GITHUB_OWNER = "altmanAI"
  FOUNDER_NAME = "Blake Hunter Altman"
  FOUNDER_GITHUB_LOGIN = "altmanAI"
  FOUNDER_GITHUB_USER_ID = "233472124"
  FOUNDER_APPROVAL_PHRASE = "All Clear for Impact"
  AI_PARTNER_NAME = "AltmanAI Model 2.0"
  AUTHORIZATION_RECORD_ID = "ALTMANAI-CI-VERIFY-2026-07-13-001"
  ALLOW_STATIC_GITHUB_TOKEN = "false"
  POLICY_PATH = "./config/policy.json"
  VERIFICATION_PATH = "./config/verification.json"
  EVIDENCE_LEDGER_PATH = "/app/data/evidence.ndjson"
  EVIDENCE_BACKUP_DIR = "/app/data/backups"
  LEDGER_BACKUP_RETENTION_DAYS = "30"
  DEPLOYMENT_ENVIRONMENT = "production"
  DEPLOYMENT_REGION = "iad"

[mounts]
  source = "altmanai_ci_data"
  destination = "/app/data"
  initial_size = "1gb"
  snapshot_retention = 30
  scheduled_snapshots = true
  auto_extend_size_threshold = 80
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/readyz"
    protocol = "http"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
