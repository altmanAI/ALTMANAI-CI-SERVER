name: Deploy Fly Production

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Human-approved deployment reason
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: altmanai-ci-server-production
  cancel-in-progress: false

env:
  FLYCTL_VERSION: '0.4.69'

jobs:
  deploy:
    name: Validate and deploy
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production

    steps:
      - name: Verify deployment controls
        env:
          DEPLOYMENT_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          test -n "${DEPLOYMENT_REASON}"
          test -n "${FLYCTL_VERSION}"
          echo "Deployment is human-triggered from main with reviewed immutable action revisions."

      - name: Check out exact revision
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify checked-out revision
        run: test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Set up Node.js
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate source and tests
        run: |
          npm run check
          npm test
          npm run smoke
          npm run verify-ledger
          npm pack --dry-run

      - name: Build production container
        run: docker build --tag altmanai-ci-server:${GITHUB_SHA} .

      - name: Set up pinned flyctl
        # superfly/flyctl-actions immutable revision; flyctl version is reviewed above.
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: ${{ env.FLYCTL_VERSION }}

      - name: Verify flyctl version
        run: flyctl version | grep -F "v${FLYCTL_VERSION}"

      - name: Deploy with rolling replacement
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only --config fly.toml --strategy rolling --wait-timeout 10m

      - name: Verify production health
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 \
            https://altmanai-ci-server.fly.dev/healthz
          curl --fail --show-error --silent --retry 5 --retry-delay 5 \
            https://altmanai-ci-server.fly.dev/readyz
