name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runner-diagnostic:
    name: GitHub-hosted runner diagnostic
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm runner execution
        run: |
          echo "GitHub-hosted runner started successfully."
          uname -a
          env | sort | grep '^GITHUB_' | sed -E 's/(TOKEN|SECRET|KEY)=.*/\1=[REDACTED]/' || true

  validate:
    name: Validate Node service
    needs: runner-diagnostic
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Report toolchain
        run: |
          node --version
          npm --version
          docker --version

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate JavaScript syntax
        run: npm run check

      - name: Run unit and integration tests
        run: npm test

      - name: Run service smoke test
        run: npm run smoke

      - name: Verify evidence ledger
        run: npm run verify-ledger

      - name: Build container image
        run: docker build --tag altmanai-ci-server:${{ github.sha }} .
