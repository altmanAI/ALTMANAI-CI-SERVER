# Temporary containment: GitHub-hosted jobs are failing before the first step
# across multiple altmanAI repositories. Keep manual until account runners recover.
name: CI (manual while hosted runners are restricted)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node 22 validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: node:22.16.0-bookworm-slim
    steps:
      - name: Install Git and certificates
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends git ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Fetch exact workflow revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Verify runtime and lockfile
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate syntax and configuration
        run: npm run check

      - name: Run automated tests
        run: npm test

      - name: Run service smoke test
        run: npm run smoke

      - name: Verify evidence ledger
        run: npm run verify-ledger

      - name: Verify package contents
        run: npm pack --dry-run

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact workflow revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Build production image
        run: docker build --tag altmanai-ci-server:${GITHUB_SHA} .
